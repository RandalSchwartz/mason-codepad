name: publish_to_brickyard

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: dart pub get

      - name: Run integration tests
        run: dart test

      - name: Run hook tests
        run: dart test
        working-directory: codepad/hooks

      - name: Install Mason
        run: dart pub global activate mason_cli

      - name: Create credentials file
        run: |
          mkdir -p ~/.config/mason
          echo '${{ secrets.MASON_CREDENTIALS }}' > ~/.config/mason/mason-credentials.json

      - name: Publish codepad
        run: mason publish --directory codepad --force
